<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Panel</title>
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #0a192f 0%, #030811 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container Card */
        .card {
            background: rgba(10, 20, 35, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 180, 216, 0.1);
            text-align: center;
        }

        /* HALAMAN 1: LOGIN */
        .avatar-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .title span {
            color: #00b4d8;
        }

        .subtitle {
            font-size: 13px;
            color: #8a99ad;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #b0c4de;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.icon-left {
            position: absolute;
            left: 14px;
            color: #00b4d8;
            font-size: 14px;
        }

        .input-wrapper i.icon-right {
            position: absolute;
            right: 14px;
            color: #00b4d8;
            font-size: 14px;
            cursor: pointer;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 40px;
            background: rgba(15, 28, 48, 0.8);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input::placeholder {
            color: #4a5d78;
        }

        .input-wrapper input:focus {
            border-color: #00b4d8;
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.4);
        }

        .message {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            background: rgba(255, 77, 77, 0.2);
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(90deg, #1d4ed8 0%, #00b4d8 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-action:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(0, 180, 216, 0.5);
            transform: translateY(-1px);
        }

        /* HALAMAN 2: DASHBOARD (SEMBUNYI SECARA DEFAULT) */
        #pageDashboard {
            display: none;
        }

        .dashboard-content {
            color: #ffffff;
            padding: 10px 0;
        }

        .dashboard-icon {
            font-size: 50px;
            color: #00b4d8;
            margin-bottom: 15px;
        }

        .btn-logout {
            background: linear-gradient(90deg, #d81d1d 0%, #d80054 100%);
            box-shadow: 0 4px 15px rgba(216, 0, 84, 0.3);
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <!-- HALAMAN 1: FORM LOGIN -->
    <div id="pageLogin" class="card">
        <div class="avatar-container">
            <img src="https://i.pinimg.com/564x/a2/e8/3f/a2e83f3e098492efb156b26804a2dd8b.jpg" alt="Logo">
        </div>

        <div class="title">LOGIN <span>PANEL</span></div>
        <p class="subtitle">Welcome back, please enter your credentials</p>

        <div id="messageBox" class="message"></div>

        <form id="loginForm">
            <div class="input-group">
                <label>USER ID</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user icon-left"></i>
                    <input type="text" id="userid" placeholder="Enter your User ID" required>
                </div>
            </div>

            <div class="input-group">
                <label>PASSWORD</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" id="password" placeholder="Enter your Password" required>
                    <i class="fa-solid fa-eye icon-right" onclick="togglePassword()"></i>
                </div>
            </div>

            <button type="submit" class="btn-action">
                <i class="fa-solid fa-right-to-bracket"></i> LOGIN
            </button>
        </form>
    </div>

    <!-- HALAMAN 2: HALAMAN KEDUA (DASHBOARD) -->
    <div id="pageDashboard" class="card">
        <div class="dashboard-content">
            <i class="fa-solid fa-circle-check dashboard-icon"></i>
            <div class="title">HALAMAN <span>KEDUA</span></div>
            <p class="subtitle" style="margin-bottom: 20px;">Selamat Datang Kembali, <strong id="userDisplay" style="color:#00b4d8;"></strong>!</p>
            <p style="font-size: 14px; color: #a0aab8;">Anda berhasil masuk ke dalam sistem panel utama.</p>
            
            <button onclick="logout()" class="btn-action btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> LOGOUT
            </button>
        </div>
    </div>

    <script>
        // Toggle Show/Hide Password
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = event.target;
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Pindah Halaman saat Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userId = document.getElementById('userid').value;
            const password = document.getElementById('password').value;
            const messageBox = document.getElementById('messageBox');

            if (userId === 'RAFFI' && password === 'RAFFI') {
                // Sembunyikan pesan error jika ada
                messageBox.style.display = 'none';

                // Tampilkan nama pengguna di halaman kedua
                document.getElementById('userDisplay').innerText = userId;

                // Sembunyikan Halaman 1, Tampilkan Halaman 2
                document.getElementById('pageLogin').style.display = 'none';
                document.getElementById('pageDashboard').style.display = 'block';
            } else {
                messageBox.innerText = 'User ID atau Password Salah!';
                messageBox.style.display = 'block';
            }
        });

        // Fungsi Logout untuk Kembali ke Halaman 1
        function logout() {
            document.getElementById('pageDashboard').style.display = 'none';
            document.getElementById('pageLogin').style.display = 'block';
            document.getElementById('userid').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
